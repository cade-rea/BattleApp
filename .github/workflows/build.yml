name: Build

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      # the runner image already has the Android SDK; AGP downloads any missing platform
      # core rules tests, app unit tests, and a debug build of the app and its device tests
      - name: Build and test
        run: ./gradlew --continue :core:test :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/'

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: battleapp-debug
          path: app/build/outputs/apk/debug/*.apk
