name: Deploy server

# Ships the PvP server to Fly.io when server or rules code lands on main. Needs the
# FLY_API_TOKEN repository secret; without it the deploy is skipped.
on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'core/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'Dockerfile'
      - 'fly.toml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

# one deploy at a time, and never cancel one halfway
concurrency:
  group: deploy-server
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

    steps:
      - name: Check for the Fly.io token
        if: env.FLY_API_TOKEN == ''
        run: echo "::notice::FLY_API_TOKEN isn't set, so the server isn't deployed."

      - uses: actions/checkout@v5
        if: env.FLY_API_TOKEN != ''

      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: env.FLY_API_TOKEN != ''

      # one machine only: matches live in its memory
      - name: Deploy
        if: env.FLY_API_TOKEN != ''
        run: flyctl deploy --remote-only --ha=false
