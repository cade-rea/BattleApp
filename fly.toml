# Fly.io settings for the PvP server. Deploys run from GitHub Actions (.github/workflows/deploy.yml).
#
# Matchmaking and matches live in the server's memory, so this must stay ONE machine that
# never sleeps: deploys pass --ha=false, and machines don't auto-stop.

# must be unique on Fly.io; change it if the name is taken, and update the app's default address
app = "battleapp-pvp"
primary_region = "iad"

[env]
  TICK_LENGTH_MS = "1000"

[http_service]
  internal_port = 8080
  # phones connect with wss://, which Fly terminates
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
